[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re-publisher"
version = "0.1.0"
description = "Telegram folder collector service for PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "Jinja2>=3.1,<4",
    "joblib>=1.4,<2",
    "langdetect>=1.0,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "Pillow>=10,<12",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9,<1",
    "PyYAML>=6,<7",
    "qrcode>=8,<9",
    "scikit-learn>=1.9,<2",
    "SQLAlchemy>=2.0,<3",
    "Telethon>=1.36,<2",
    "typer>=0.12,<1",
    "trafilatura>=1.9,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]
local-models = [
    "argostranslate>=1.9,<2",
    "sentencepiece>=0.2,<1",
    "torch>=2.3,<3",
    "transformers>=4.42,<5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
