{% extends "base.html" %}
{% block content %}
<section class="toolbar"><div><h1>Признаки</h1><p class="muted">Категории модели, назначаемые фильтрами. Оценки конкретных постов показаны на карточках. Прежние пользовательские признаки сохраняются.</p></div><a class="button" href="/pipeline/filters">Настроить фильтры →</a></section>
<div class="selection-layout">
  <article hidden><h2 id="mark-form-heading">Пользовательский признак прежнего фильтра</h2>
    <form id="mark-form" class="selection-form">
      <label>Название<input name="name" maxlength="80" required></label>
      <label>Описание<textarea name="description" maxlength="1000" rows="3"></textarea></label>
      <label>Цвет<input name="color" type="color" value="#a78bfa"></label>
      <label class="checkbox-row"><input name="archived" type="checkbox"> Архивный</label>
      <div class="selection-actions"><button type="submit">Сохранить</button><button type="button" id="mark-new">Новый признак</button></div>
    </form><p id="marks-feedback" role="status"></p>
  </article>
  <section id="marks-list" aria-label="Словарь признаков"></section>
</div>
<script src="/static/selection-admin.js?v=20260930-3" defer></script>
{% endblock %}
