{% extends "base.html" %}
{% block content %}
    <section class="toolbar">
        <div>
            <h1>Конвейер</h1>
            <p class="muted">Пост → категории → отбор по фильтрам → ссылка на источник → на публикацию.</p>
        </div>
        <a class="button secondary" href="/pipeline/filters">Настроить отбор</a>
    </section>
    <form class="board-toolbar" method="get"><label class="search-field">Поиск по тексту<input name="q" value="{{ q }}" placeholder="Текст поста"></label><label>Лейбл<select name="mark"><option value="">Все</option>{% for item in marks %}<option value="{{ item.id }}" {% if mark==item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><label>Фильтр<select name="selection_filter"><option value="">Все</option>{% for item in filters %}<option value="{{ item.id }}"
        {% if selection_filter==item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}</select></label><label>Порядок<select name="order"><option value="desc" {% if order!='asc' %}selected{% endif %}>Новые сверху</option><option value="asc" {% if order=='asc' %}selected{% endif %}>Старые сверху</option></select></label><label>На колонку<select name="limit">{% for number in [15,30,60,100] %}<option value="{{ number }}" {% if limit==number %}selected{% endif %}>{{ number }}</option>{% endfor %}</select></label><label class="checkbox-row"><input type="checkbox"
       name="active"
       value="true"
       {% if active %}checked{% endif %}>В работе</label><button type="submit">Показать</button><a href="/pipeline">Сбросить</a></form>
    <p class="sync-status"
       data-poll-status
       role="status">Карточки и счётчики обновляются каждые 5 секунд. Отправка в каналы выключена.</p>
    <section class="kanban-board"
             data-pipeline
             data-filtered="{{ 'true' if q or mark or selection_filter or active else 'false' }}">{% include "_board_columns.html" %}</section><script src="/static/pipeline.js?v=automation-1" defer></script>{% endblock %}
