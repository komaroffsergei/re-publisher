name: Portfolio validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install '.[dev]'
      - run: pytest
# Deployment uses a pinned image built outside the VPS.
# No SSH credentials, host-wide Docker cleanup or log deletion.
