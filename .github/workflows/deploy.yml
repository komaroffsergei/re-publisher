name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          DEPLOY_PORT="${DEPLOY_PORT:-22}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -Eeuo pipefail
             mkdir -p /opt/re-publisher
             cd /opt/re-publisher
             echo "Disk before cleanup:"
             df -h /
             if command -v docker >/dev/null 2>&1; then
               docker system df || true
               docker builder prune -af || true
               docker image prune -af || true
               docker container prune -f || true
             fi
             if [ -d /var/lib/docker/containers ]; then
               find /var/lib/docker/containers -name "*-json.log" -type f -size +50M -exec truncate -s 0 {} \; || true
             fi
             git gc --prune=now || true
             rm -rf .git/objects/pack/tmp_pack_* || true
             echo "Disk after cleanup:"
             df -h /
             if [ ! -d .git ]; then
               git init
               git remote add origin git@github.com:komaroffsergei/re-publisher.git
             fi
             git fetch --prune origin
             git checkout -B main origin/main
             git reset --hard origin/main
             chmod +x scripts/deploy.sh
             ./scripts/deploy.sh'
