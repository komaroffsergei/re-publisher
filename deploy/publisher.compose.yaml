name: portfolio-publisher

x-app: &app
  image: ${PUBLISHER_IMAGE:?PUBLISHER_IMAGE is required}
  pull_policy: never
  restart: unless-stopped
  env_file: .env
  networks: [backend, edge]
  volumes:
    - ./sessions:/app/sessions
    - ./media:/app/media
    - ./models:/app/models
    - ./cache:/app/cache
    - ./artifacts:/app/artifacts
    - ./reports:/app/reports
  mem_limit: 512m
  cpus: 0.8
  pids_limit: 100
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}

services:
  web:
    <<: *app
    command: [uvicorn, app.web.main:app, --host, 0.0.0.0, --port, "8080"]
    ports: ["127.0.0.1:18404:8080"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  collector:
    <<: *app
    command: [python, -m, app.main, run, --folder, MAX]
    networks: [backend, telegram-egress]
    healthcheck:
      test: [CMD-SHELL, "test -s /app/sessions/max_collector.session"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  backend: {external: true, name: portfolio-backend}
  edge: {external: true, name: portfolio-edge}
  telegram-egress: {external: true, name: codex-proxy_default}
