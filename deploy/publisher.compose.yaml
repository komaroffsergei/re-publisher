name: portfolio-publisher

x-app: &app
  image: ${PUBLISHER_IMAGE:?PUBLISHER_IMAGE is required}
  pull_policy: never
  restart: unless-stopped
  env_file: .env
  networks: [backend, edge]
  volumes:
    - ./sessions:/app/sessions
    - ./media:/app/media
    - ./models:/app/models
    - ./cache:/app/cache
    - ./artifacts:/app/artifacts
    - ./reports:/app/reports
  mem_limit: 512m
  cpus: 0.8
  pids_limit: 100
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "3"}

services:
  web:
    <<: *app
    environment:
      DB_POOL_SIZE: "2"
      DB_MAX_OVERFLOW: "0"
    command: [uvicorn, app.web.main:app, --host, 0.0.0.0, --port, "8080"]
    ports: ["127.0.0.1:18404:8080"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  collector:
    <<: *app
    command: [python, -m, app.main, run, --folder, MAX]
    networks: [backend, telegram-egress]
    environment:
      COLLECTOR_MODE: new_only
      COLLECTOR_PROCESS_SAVED_POSTS: "false"
      COLLECT_COMMENTS: "false"
      AUTO_PUBLISH: "false"
      ENABLE_EXTERNAL_LLM: "false"
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "0"
    healthcheck:
      test: [CMD, python, -c, "import json,time;d=json.load(open('/tmp/publisher-health-collector.json'));assert time.time()-d['heartbeat_at']<60 and not d['error'] and d['last_success_at'] and time.time()-d['last_success_at']<900"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  pipeline-coordinator:
    <<: *app
    command: [python, -m, app.pipeline_coordinator]
    environment:
      AUTO_PUBLISH: "false"
      ENABLE_EXTERNAL_LLM: "false"
      ENABLE_PROCESSING: "false"
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    networks: [backend]
    volumes: ["./media:/app/media:ro"]
    mem_limit: 256m
    cpus: 0.25
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import json,time;d=json.load(open('/tmp/publisher-health-coordinator.json'));assert time.time()-d['heartbeat_at']<60 and not d['error']"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  taxonomy-worker:
    <<: *app
    command: [python, -m, app.taxonomy.worker]
    environment:
      TAXONOMY_WORKER_MODEL: tfidf
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    networks: [backend]
    volumes:
      - ./models:/app/models:ro
    mem_limit: 768m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import os,time;assert time.time()-os.path.getmtime('/tmp/taxonomy-worker-heartbeat')<45"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  taxonomy-worker-minilm:
    <<: *app
    image: ${PUBLISHER_MINILM_IMAGE:?PUBLISHER_MINILM_IMAGE is required}
    command: [python, -m, app.taxonomy.worker]
    environment:
      TAXONOMY_WORKER_MODEL: minilm
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
    networks: [backend]
    volumes:
      - ./models:/app/models:ro
    mem_limit: 2048m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import os,time;assert time.time()-os.path.getmtime('/tmp/taxonomy-worker-heartbeat')<45"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s

networks:
  backend: {external: true, name: portfolio-backend}
  edge: {external: true, name: portfolio-edge}
  telegram-egress: {external: true, name: codex-proxy_default}
